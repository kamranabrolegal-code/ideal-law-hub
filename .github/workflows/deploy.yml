Name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      
      # Agar output .output/public mein banti hai (TanStack Start standard), toh ye copy karega:
      - name: Create SPA fallback for GitHub Pages
        run: |
          if [ -d ".output/public" ]; then
            cp .output/public/index.html .output/public/404.html
          elif [ -d "dist" ]; then
            cp dist/index.html dist/404.html
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          # Yeh automatically check kar lega ke folder 'dist' hai ya '.output/public'
          path: ${{ hashFiles('dist/index.html') && 'dist' || '.output/public' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
