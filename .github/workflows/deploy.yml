  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 18
      cache: 'npm'

  - name: Install
    run: npm ci

  - name: Build
    run: npm run build

  - name: Copy fallback 404 (safety)
    run: node scripts/copy-404.js || true

  - name: Determine publish directory
    id: find_publish_dir
    run: |
      if [ -d ".output/public" ]; then echo "PUBLISH_DIR=.output/public" >> $GITHUB_ENV
      elif [ -d "dist" ]; then echo "PUBLISH_DIR=dist" >> $GITHUB_ENV
      elif [ -d "docs" ]; then echo "PUBLISH_DIR=docs" >> $GITHUB_ENV
      elif [ -d "build" ]; then echo "PUBLISH_DIR=build" >> $GITHUB_ENV
      else
        echo "No publish directory found. Looking for common directories failed.";
        ls -la;
        exit 1;
      fi

  - name: Show publish dir
    run: echo "Publish directory: $PUBLISH_DIR"

  - name: Deploy to gh-pages
    uses: peaceiris/actions-gh-pages@v4
    with:
      github_token: ${{ secrets.GITHUB_TOKEN }}
      publish_dir: ${{ env.PUBLISH_DIR }}
      keep_files: false
